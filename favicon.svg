<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- badge background -->
  <circle cx="16" cy="16" r="16" fill="#1E2E2A"/>
  <!-- gold outer ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#B8963E" stroke-width="1.2"/>
  <!-- gold inner dashed ring -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#B8963E" stroke-width="0.6" stroke-dasharray="2.2 1.6"/>
  <!-- M lettermark italic -->
  <text x="16" y="21"
    font-family="Georgia,'Times New Roman',serif"
    font-size="13"
    font-style="italic"
